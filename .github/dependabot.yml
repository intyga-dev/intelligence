version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Node typings follow the Node 26 runtime; revisit this when the runtime major changes.
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      # One pull request for the routine moves. Majors stay separate, because a major is a decision
      # and deserves its own review rather than a place in a batch.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
