name: CI

on:
  push:
    branches: [main]
  pull_request:

# A pull request that is pushed to twice does not need the first run's answer.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    # The setup and sign-in tests drive the real routes against a real database — they are the
    # regression tests for the two ways a stranger could take an instance over. Without this service
    # they skip, which is right on a laptop and wrong here.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: intelligence
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: intelligence_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U intelligence -d intelligence_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://intelligence:ci-only@localhost:5432/intelligence_test
      # prisma.config.ts refuses to load without DIRECT_URL — even `prisma generate`, which never
      # connects. A clean checkout has no .env, so without this the job failed at its first Prisma step.
      DIRECT_URL: postgresql://intelligence:ci-only@localhost:5432/intelligence_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Prisma client is generated into src/generated/ and gitignored, so typecheck cannot run
      # without it. No database connection is made — generate reads the schema, not the server.
      - run: pnpm db:generate

      - run: pnpm db:deploy
        env:
          DATABASE_URL: postgresql://intelligence:ci-only@localhost:5432/intelligence_test

      # typecheck, lint, boundary check, unit tests. Exactly what CONTRIBUTING tells contributors to
      # run locally: one command, so there is no second set of checks to discover after review.
      - run: pnpm verify

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Production dependencies only. A dev-only advisory is worth knowing about and is not a
      # reason to fail a pull request that did not introduce it.
      - run: pnpm audit --prod --audit-level high
